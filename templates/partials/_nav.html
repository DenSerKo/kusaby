<nav>
    {% if request.user.is_authenticated %}
        <a href="{% url 'core:index' %}">Главная</a>
        <a href="{% url 'documents:index' %}">Документы</a>
        <a href="{% url 'documents:organizations' %}">Организации</a>
        <a href="{% url 'documents:events' %}">История изменений — DEV</a>

        <span>{{ request.user.get_username }}</span>
        <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit">Выйти из сервиса</button>
        </form>
    {% else %}
        <a href="{% url 'accounts:login' %}">Войти</a>
    {% endif %}
</nav>
