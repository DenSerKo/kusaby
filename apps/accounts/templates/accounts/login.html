{% extends "base.html" %}

{% block main %}
<h1>Вход</h1>

{% if messages %}
  <ul>
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}

<form method="post">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">

  <div>
    <label>Логин</label>
    <input type="text" name="username" required>
  </div>

  <div>
    <label>Пароль</label>
    <input type="password" name="password" required>
  </div>

  <button type="submit">Войти</button>
</form>
{% endblock %}
