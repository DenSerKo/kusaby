{% extends "base.html" %}

{% block title %}Вход в сервис{% endblock %}

{% block main %}
    <h1>Вход в сервис</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Войти</button>
        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
    </form>
{% endblock %}
