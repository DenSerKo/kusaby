{% extends "base.html" %}

{% block title %}Подключение Saby{% endblock %}

{% block main %}
    <h1>Подключение Saby</h1>
    <p>Для подключения вы будете перенаправлены на страницу авторизации Saby.</p>
    <button
        type="button"
        data-saby-auth
        data-auth-url="{% url 'accounts:saby_authorize' %}"
    >
        Авторизоваться через Saby
    </button>
{% endblock %}
