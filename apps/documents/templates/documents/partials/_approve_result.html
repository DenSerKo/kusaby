<div class="action" id="document-{{ document_id }}">
    {% if success %}
        <p class="notification notification--success">{{ message }}</p>
    {% else %}
        <p class="notification notification--error" role="alert">{{ message }}</p>
        {% if details %}<p>{{ details }}</p>{% endif %}
        <form hx-post="{% url 'documents:approve-document' %}" hx-target="#document-{{ document_id }}" hx-swap="outerHTML">
            {% csrf_token %}
            <input type="hidden" name="document_id" value="{{ document_id }}">
            <button type="submit">Повторить</button>
        </form>
    {% endif %}
</div>
