{% if queued %}
    <p class="notification" role="status">{{ message }}</p>
{% elif success %}
    <p class="notification notification--success" role="status">{{ message }}</p>
{% else %}
    <div class="approval-error" role="alert">
        <p class="notification notification--error">{{ message }}</p>
        {% if details %}<div class="approval-details">{{ details|linebreaksbr }}</div>{% endif %}
    </div>
{% endif %}
