{% extends 'base.html' %}
{% block title %}
    Список изменений
{% endblock %}
{% block main %}
    <h1>Список изменений</h1>

    <form
        class="events-filter"
        hx-get="{% url 'documents:events' %}"
        hx-trigger="submit"
        hx-target="#events"
        hx-swap="innerHTML"
        hx-push-url="true"
    >
        <div class="events-filter__fields">
            <div class="events-filter__field">
                <label for="from-datetime">Период с</label>
                <input
                    type="datetime-local"
                    name="from_datetime"
                    id="from-datetime"
                    value="{{ from_datetime }}"
                >
            </div>
            <div class="events-filter__field">
                <label for="to-datetime">Период по <span>(необязательно)</span></label>
                <input
                    type="datetime-local"
                    name="to_datetime"
                    id="to-datetime"
                    value="{{ to_datetime }}"
                >
            </div>
            <div class="events-filter__field">
                <label for="amount-min">Сумма от, ₽ <span>(необязательно)</span></label>
                <input
                    type="number"
                    name="amount_min"
                    id="amount-min"
                    min="0"
                    step="0.01"
                    inputmode="decimal"
                    placeholder="Например, 1000"
                    value="{{ amount_min }}"
                >
            </div>
            <div class="events-filter__field">
                <label for="amount-max">Сумма до, ₽ <span>(необязательно)</span></label>
                <input
                    type="number"
                    name="amount_max"
                    id="amount-max"
                    min="0"
                    step="0.01"
                    inputmode="decimal"
                    placeholder="Например, 5000"
                    value="{{ amount_max }}"
                >
            </div>
        </div>

        <div class="events-filter__footer">
            <p>Пустые границы не ограничивают сумму. Если указана только одна — применяется только она.</p>
            <div class="events-filter__actions">
                <a class="button button--secondary" href="{% url 'documents:events' %}">Сбросить</a>
                <button type="submit">Применить</button>
            </div>
        </div>
    </form>

    <section id="events">
        {% include 'documents/partials/_events.html' %}
    </section>
{% endblock %}
